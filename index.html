:root{
  color-scheme:light;
  /* Musaad Academy tokens mapped onto the template's variable names */
  --navy:#4C1522; --indigo:#8E4A1E; --blue:#BD6328; --periwinkle:#94783F;
  --mint:#BE9B58; --mint-tint:#F4EBD7; --mint-deep:#BE9B58; --mint-dark:#94783F;
  --good:#4F8279; --good-deep:#6FA39A; --good-tint:#E6F0EE;
  --white:#FFFFFF; --ivory:#FBF4EB; --cloud:#EADFCB; --gray:#D9CBB3; --gray-mid:#A89478; --charcoal:#6B4434;
  --danger:#A3441C; --danger-tint:#F8E6D8;
  --f-head:"Madani Display","Madani Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  --f-text:"Madani Arabic","Noto Naskh Arabic",Tahoma,system-ui,sans-serif;
  --r-panel:32px; --r-tile:22px; --r-inner:14px; --r-ctl:14px;
  --shadow-sm:0 2px 8px rgba(58,46,34,.08); --shadow-gold:0 12px 32px rgba(201,160,92,.22);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--white);color:var(--navy);font-family:var(--f-text);font-weight:400;font-size:17px;line-height:1.8;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-head);font-weight:700;line-height:1.4;text-wrap:balance;margin:0}
p{margin:0}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:760px;margin:0 auto}
.label{font-size:.88rem;color:var(--charcoal);font-weight:700}
.en{font-family:var(--f-text);font-weight:700;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;border:2px solid var(--navy);background:var(--white);color:var(--navy);
  padding:.45em 1.3em;border-radius:var(--r-ctl);cursor:pointer;font-weight:700;font-size:1rem;min-height:48px;transition:background-color .15s,color .15s,border-color .15s}
.btn:hover{background:var(--cloud)}
.btn.primary{background:var(--navy);color:var(--white)}
.btn.primary:hover{background:var(--indigo);border-color:var(--indigo)}
.btn.primary:disabled{background:var(--gray);border-color:var(--gray);color:var(--white);cursor:not-allowed}
.btn.link{background:none;border:none;color:var(--charcoal);font-weight:400;font-size:.9rem;min-height:40px;padding:.3em .6em;text-decoration:underline;text-underline-offset:4px}
.btn.link:hover{color:var(--navy);background:none}
.btn.big{font-size:1.1rem;padding:.55em 2em;min-height:54px}

/* header: logo and title on opposite sides */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px 14px;border-bottom:2px solid var(--mint);margin-bottom:28px}
.title-side{display:flex;flex-direction:column;gap:0;min-width:0}
.title-side b{font-family:var(--f-head);font-size:1.15rem}
.title-side .en{color:var(--charcoal);font-size:.64rem}
.logo{width:140px;height:auto;display:block}
.tools-row{display:flex;gap:8px;align-items:center}
.confirmbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.95rem}

/* intro */
.intro{display:grid;gap:28px}
.cover{background:var(--navy);color:var(--white);border-radius:var(--r-tile);padding:36px 32px;display:grid;gap:10px}
.cover .en{color:var(--mint)}
.cover h1{font-size:clamp(2.3rem,8vw,3.4rem);line-height:1.25}
.cover .sub{font-size:1.25rem;font-weight:300}
.cover .sub-en{font-size:.95rem;font-weight:300;color:var(--gray)}
.story-wrap{display:flex;gap:20px;align-items:center}
.story-wrap .av{width:112px;height:112px}
.story{flex:1;min-width:0;font-weight:300;font-size:1.18rem;line-height:2;display:grid;gap:10px;background:var(--mint-tint);border-inline-start:6px solid var(--mint-deep);border-radius:var(--r-inner);padding:20px 24px}
.goal-box{border-inline-start:2px solid var(--mint);padding-inline-start:16px}
.goal-box h2{font-size:1.05rem;margin-bottom:2px;color:var(--blue)}
.grow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;list-style:none;margin:0;padding:0}
.grow li{border:2px solid var(--cloud);border-radius:var(--r-inner);padding:14px 10px;display:grid;gap:2px;text-align:center}
.grow .num{font-weight:700;color:var(--mint-deep);font-size:.85rem;font-variant-numeric:tabular-nums}
.grow b{font-family:var(--f-head);font-size:1.05rem;color:var(--blue)}
.grow span{font-size:.82rem;color:var(--charcoal);line-height:1.5}
.start{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:.86rem;color:var(--charcoal)}

/* tutorial */
.tour{display:grid;gap:18px}
.tour-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tour-count{font-size:.88rem;font-weight:700;color:var(--mint-dark);font-variant-numeric:tabular-nums}
.tour h1{font-size:clamp(1.6rem,5vw,2.1rem)}
.tour-strip{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tour-strip li{display:grid;justify-items:center;gap:4px;font-size:.85rem;color:var(--gray-mid);padding-bottom:8px;border-bottom:4px solid var(--cloud)}
.tour-strip .av{width:44px;height:44px;opacity:.5}
.tour-strip li.seen{color:var(--charcoal);border-color:var(--mint-deep)}
.tour-strip li.seen .av{opacity:1}
.tour-strip li.on{color:var(--blue);font-weight:700;border-color:var(--blue)}
.tour-strip li.on .av{opacity:1}
.tour-card{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start;border:2px solid var(--cloud);border-radius:var(--r-tile);padding:26px}
.tour-face{display:grid;justify-items:center;gap:8px;text-align:center}
.tour-face .av{width:200px;height:200px}
.tour-face h2{font-size:1.8rem;color:var(--blue)}
.tour-body{display:grid;gap:8px;min-width:0}
.tour-body h3{font-size:1rem;color:var(--navy)}
.tour-body h3:not(:first-child){margin-top:6px}
.tour-body ul{margin:0;padding-inline-start:1.2em;display:grid;gap:4px}
.tour-body li::marker{color:var(--mint-deep)}
.tour-act{margin-top:8px;background:var(--mint-tint);border-inline-start:6px solid var(--mint-deep);border-radius:var(--r-inner);padding:12px 16px}
.tour-act b{color:var(--mint-dark)}
.tour-note{font-size:.92rem;background:var(--cloud);border-radius:var(--r-ctl);padding:10px 14px}
.tour-nav{justify-content:space-between}
.tour-nav .btn:only-child{margin-inline-start:auto}
.foot-links{display:flex;gap:4px;flex-wrap:wrap}

/* progress */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;list-style:none;margin:0 0 10px;padding:0}
.steps li{border-top:4px solid var(--cloud);padding-top:6px;font-size:.92rem;color:var(--gray-mid)}
.steps li.done{border-color:var(--mint-deep);color:var(--navy)}
.steps li.now{border-color:var(--blue);color:var(--blue);font-weight:700}
.hud{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--white);padding-block:10px 10px;margin-bottom:22px;border-bottom:2px solid var(--cloud)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--white)}
.hud .steps{margin-bottom:6px}
.statusline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;font-size:.92rem;color:var(--charcoal)}
#q-h,#fb-h{scroll-margin-top:150px}
@media (prefers-reduced-motion:no-preference){.trust .av{transition:transform .2s}.trust .av.pop{animation:pop .45s ease-out}@keyframes pop{40%{transform:scale(1.12)}}}
.trust{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.trust b{color:var(--blue)}
.av{display:block;border-radius:50%;flex-shrink:0;max-width:100%}
.trust .av{width:48px;height:48px}
.dots{display:inline-flex;gap:4px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--cloud)}
.dots i.on{background:var(--blue)}

/* conversation */
.chat{display:grid;gap:14px;margin-bottom:22px}
.sep{text-align:center;font-size:.82rem;font-weight:700;color:var(--mint-dark);display:flex;gap:10px;align-items:center}
.sep::before,.sep::after{content:"";flex:1;height:2px;background:var(--mint)}
.msg{max-width:88%;display:grid;gap:2px}
.msg .who{font-size:.8rem;color:var(--charcoal);font-weight:700}
.msg.me{justify-self:end;background:var(--cloud);border-radius:var(--r-inner) var(--r-inner) var(--r-inner) 4px;padding:10px 16px}
.msg.her{justify-self:start;grid-template-columns:44px minmax(0,1fr);column-gap:12px;align-items:start}
.msg.her .av{width:44px;height:44px;margin-top:4px}
.msg.her > div{display:grid;gap:2px;min-width:0}
.msg.her .who{color:var(--blue)}
.msg.her .txt{font-weight:300;font-size:1.22rem;line-height:1.9}

.card{background:var(--white);border:2px solid var(--cloud);border-radius:var(--r-inner);padding:22px;display:grid;gap:14px}
.scene{font-weight:300;font-size:1.12rem;color:var(--charcoal)}
.scene q{color:var(--blue);font-weight:400;quotes:"«" "»"}
.card h2{font-size:1.05rem}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;text-align:start;width:100%;background:var(--white);
  border:2px solid var(--cloud);border-radius:var(--r-ctl);padding:12px 14px;cursor:pointer;line-height:1.7;transition:border-color .15s,background-color .15s}
.opt:hover{border-color:var(--mint)}
.opt[aria-checked="true"]{border-color:var(--mint-deep);background:var(--mint-tint)}
.opt .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--gray-mid);margin-top:6px;display:grid;place-items:center}
.opt[aria-checked="true"] .dot{border-color:var(--navy)}
.opt[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--navy)}
.row{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.good{color:var(--mint-dark);background:var(--mint-tint)}
.pill.trap{color:var(--danger);background:var(--danger-tint)}

function compute(hist){
  const s={open:1, prio:false, fear:false, sc:{}, used:{}, ret:null, node:"W1", log:[], good:0, trap:0};
  for(const cid of hist){
    if(s.node==="END") break;
    const id=s.node, node=NODES[id], list=choicesFor(id,s), ch=list.find(c=>c.id===cid);
    if(!ch) break;
    const was={prio:s.prio, fear:s.fear}, from=s.open;
    s.open=clamp(s.open+(ch.open||0),-3,8);
    const r=val(ch.say,s); let reply=r;
    if(typeof r==="object"){ reply=r.t; Object.assign(s,r.set||{}); }
    if(ch.set) Object.assign(s,ch.set);
    if(s.fear) s.prio=true;
    const d=val(ch.sc,s)||{}; for(const k in d) s.sc[k]+=d[k];
    TYPES[ch.type].good ? s.good++ : s.trap++;
    const better = TYPES[ch.type].good ? null : list.find(c=>c.id!==cid && TYPES[c.type].good);
    s.log.push({id, cid:ch.id, area:node.area, back:!!node.back, type:ch.type, text:val(ch.text,s), reply, fb:val(ch.fb,s), d, from, to:s.open,
      revealed:(!was.prio&&s.prio)||(!was.fear&&s.fear), better: better ? {type:better.type, text:val(better.text,s)} : null});
    const target = ch.revisit ? val(ch.revisit,s) : undefined;
    if(ch.revisit){ s.used[id]=true; if(target){ s.ret=id; s.node=target; } else s.node=id; }
    else if(node.back){ s.node=s.ret; s.ret=null; }
    else s.node=node.next;
  }
  return s;
}
const DEC=Object.fromEntries(CORE.map((id,i)=>[id,i+1]));

function matrix(s){
  const L=s.log, at=id=>L.filter(l=>l.id===id), good=l=>TYPES[l.type].good, B=C.best, X=C.mx;
  const picked=(id,ids)=>at(id).some(l=>ids.includes(l.cid));
  const allGood=ids=>{ const ls=L.filter(l=>ids.includes(l.id)); return ls.length>0 && ls.every(good); };
  const lastL1=at("L1").slice(-1)[0];
  const M={
    w:[{t:"رفضت أول طلب بجملة قصيرة وصادقة", refs:["W1"], ok:picked("W1",[B.W1]), tip:X.w1},
       {t:"قدّرت الفضل دون حساب أو اتهام", refs:["W2"], ok:allGood(["W2"]), tip:X.w2},
       {t:"أعدت الحدّ نفسه حين عُرض «بس هالمرة»", refs:["W3","WR"], ok:picked("W3",[B.W3])||picked("WR",[B.WR]), tip:X.w3}],
    a:[{t:"عبّرت عن احتياجك دون اتهام أو حكم", refs:["A1","A2","AR"], ok:allGood(["A1","A2","AR"]), tip:X.a1},
       {t:X.prioT, refs:["A2","A3","WR","AR"], ok:s.prio, tip:X.prioTip},
       {t:X.fearT, refs:["A3","T1","T3","WR","AR"], ok:s.fear, tip:"يظهر هذا حين تكون الثقة عالية. قلّل الاتهام والتبرير، وتفهّم المشاعر دون أن تتراجع."}],
    t:[{t:"لم يغيّر السبب المقنع ولا الضغط العاطفي جوابك", refs:["A3","T1"], ok:allGood(["A3","T1"]), tip:X.t1},
       {t:"لم يغيّر الإلحاح جوابك", refs:["T2","WR"], ok:allGood(["T2","WR"]), tip:"أعد الحدّ بهدوء مرة أو مرتين، ثم انتقل لتطبيقه دون نقاش جديد."},
       {t:"تقبّلت الزعل دون أن تحمله أو تعاقب عليه", refs:["T3"], ok:allGood(["T3"]), tip:X.t3}],
    l:[{t:"نفّذت حدّك يوم عاد الطلب", refs:["L1"], ok:!!lastL1 && lastL1.cid===B.L1, tip:"الحدود تكتسب قوتها من اتساق الفعل، لا من كثرة الكلام."},
       {t:"بقي الباب مفتوحًا بعد «ما عاد أطلب منك شي»", refs:["L2"], ok:allGood(["L2"]), tip:"لا تتراجع ولا تعاقب. ذكّر بأن الحدّ لا يغيّر المودة."},
       {t:"اتفقتما على ما تقدر عليه فعلًا", refs:["L3"], ok:picked("L3",[B.L3]), tip:"لا تضع حدًّا لا تستطيع الالتزام به. اعرض ما تقدر عليه وتستمر فيه."}]
  };
  const out={total:0};
  for(const k in M){ const score=M[k].filter(c=>c.ok).length; out[k]={crit:M[k], score, lvl: score<=1?0 : score===2?1 : 2}; out.total+=score; }
  return out;
}

      <h2 id="fb-h" tabindex="-1">${g?"أحسنت":"انتبه، هذا فخ"} ${pill(l.type)}</h2>
      <p>${esc(l.fb)}</p>
      ${l.to!==l.from?`<p class="shift">${av(moodOf(l.to))}<span>${l.to>l.from?"زادت ثقة "+C.name+" بك":"قلّت ثقة "+C.name+" بك"}${moodOf(l.to)!==moodOf(l.from)?`، و${C.became} ${MOODS[moodOf(l.to)]}`:""}.</span></p>`:""}
      
      <div class="row"><button class="btn primary" data-act="next">${s.node==="END"?"شاهد النتيجة":"التالي"}</button></div>
    </section>`;
  } else {
    const node=NODES[s.node], list=choicesFor(s.node,s);
    h+=`<section class="card enter" aria-labelledby="q-h">
      <p class="label">${AREAS[node.area].name}${node.back?" (رجوع)":""} · <span class="en" lang="en">${AREAS[node.area].en}</span><br>${AREAS[node.area].q}</p>
      <p class="scene">${val(node.scene,s)}</p>
      <h2 id="q-h" tabindex="-1">ماذا تقول؟</h2>
      <div class="opts" role="radiogroup" aria-labelledby="q-h">
      ${list.map((c,i)=>`<button type="button" class="opt" role="radio" id="o-${c.id}" data-choice="${c.id}" aria-checked="${st.sel===c.id}" tabindex="${(st.sel?st.sel===c.id:i===0)?0:-1}">
        <span class="dot" aria-hidden="true"></span><span>${esc(val(c.text,s))}</span></button>`).join("")}
      </div>
      <div class="row"><button class="btn primary" data-act="say" ${st.sel?"":"disabled"}>قل هذا</button></div>
      
    </section>`;
  }
  $("#app").innerHTML=h;
  if(st.waiting){ const l=s.log[s.log.length-1]; if(l && moodOf(l.to)!==moodOf(l.from)){ const a=$(".trust .av"); if(a) a.classList.add("pop"); } }
  const f=focus&&$(focus); if(f) f.focus();
}

function end(){
  const s=compute(st.hist), total=s.log.length, ratio=s.good/Math.max(1,total);
  const kind = ratio>=0.75?"coach" : ratio>=0.45?"mixed" : "direct";
  const E=C.end(s,kind), quote=E.quote, truths=E.truths;
  const traps=s.log.filter(l=>!TYPES[l.type].good).length;
  const M=matrix(s);
  const R=st.refl||{};
  $("#app").innerHTML=`<div class="end enter">
    <div class="end-top">
      <h1 id="end-h" tabindex="-1">انتهى الموقف</h1>
      <div class="quote-wrap">${av(moodOf(s.open))}<p class="quote"><span>${esc(quote.replace(/[«»]/g,""))}</span></p></div>
      <div class="score"><span class="big">${s.good} من ${total}</span><span>من ردودك كانت ثابتة ومحترمة (حدّ واضح، صيغة «أنا»، أو تفهّم دون تراجع).</span></div>
      <div class="bar" role="img" aria-label="${s.good} ردود متوازنة و${s.trap} فخاخ"><span style="width:${ratio*100}%"></span></div>
    </div>

    <section class="part" aria-labelledby="t-h"><h2 id="t-h">ماذا كان يحدث فعلًا؟</h2>
      <div class="three">${truths.map(([h,ok,p])=>`<div class="card"><span class="pill ${ok?"good":"trap"}">${ok?"✓ اكتشفته":"✗ لم يظهر"}</span><h3>${h}</h3><p>${p}</p></div>`).join("")}</div>
    </section>

    <section class="part" aria-labelledby="p-h"><h2 id="p-h">مستقبلان محتملان</h2>
      <p class="note">هذه أنماط شائعة، لا توقعات مؤكدة. لا يوجد موقف واحد يضمن أي نتيجة.</p>
      <div class="two">
        <div class="card ${kind==="direct"?"mine":""}">${kind==="direct"?`<span class="pill trap">الأقرب لموقفك</span>`:""}<h3>إذا استمر التراجع أو الانفجار</h3>
          <ul>${E.direct.map(x=>`<li>${x}</li>`).join("")}</ul></div>
        <div class="card ${kind==="coach"?"mine":""}">${kind==="coach"?`<span class="pill good">الأقرب لموقفك</span>`:""}<h3>إذا كانت الحدود واضحة ومحترمة</h3>
          <ul>${E.good.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      </div>
    </section>

    <section class="part" aria-labelledby="l-h"><h2 id="l-h">مصفوفة التقييم</h2>
      <p class="note">لكل جانب ثلاثة معايير مرتبطة بقرارات محددة. كل معيار تحققه نقطة واحدة. المستوى: 0 أو 1 بداية · 2 في تقدّم · 3 متمكّن.</p>
      <div class="mx-sum">${Object.keys(DIMS).map(k=>`<a class="mx-tile" href="#mx-${k}"><span class="mx-name">${DIMS[k].name}</span><span class="mx-score">${M[k].score}<small> من 3</small></span><span class="lvl-pill l${M[k].lvl}">${LEVELS[M[k].lvl]}</span></a>`).join("")}
        <div class="mx-total"><span>المجموع</span><b>${M.total}<small> من 12</small></b></div></div>
      ${Object.keys(DIMS).map(k=>`<div class="mx-card" id="mx-${k}">
        <div class="mx-head"><h3>${DIMS[k].name}</h3><span class="mx-q">${DIMS[k].what}</span><span class="lvl-pill l${M[k].lvl}">${M[k].score} من 3 · ${LEVELS[M[k].lvl]}</span></div>
        <ul class="crit">${M[k].crit.map(c=>{ const ev=[...new Set(c.refs)].map(id=>s.log.filter(l=>l.id===id).map(l=>`<span class="ev">${refName(id)}: ${TYPES[l.type].label}</span>`).join("")).join("");
          return `<li class="${c.ok?"met":"miss"}"><span class="mark" aria-hidden="true">${c.ok?"✓":"✗"}</span><div><p class="ct"><span class="sr">${c.ok?"تحقق":"لم يتحقق"}: </span>${c.t}</p>${ev?`<p class="evs">${ev}</p>`:""}${c.ok?"":`<p class="tip"><b>للتحقق:</b> ${esc(c.tip)}</p>`}</div></li>`; }).join("")}</ul>
        <div class="scale" role="list" aria-label="مستويات ${DIMS[k].name}">${[0,1,2].map(i=>`<div class="seg ${i===M[k].lvl?"on":""}" role="listitem"><b>${LEVELS[i]} <small>${["0–1","2","3"][i]}</small></b><span>${C.LEVEL_TEXT[k][i]}</span>${i===M[k].lvl?'<span class="here">مستواك</span>':""}</div>`).join("")}</div>
      </div>`).join("")}
      <details><summary>عن هذا التقييم</summary><div class="inner">
        <p>المعايير تصف ما فعلته في هذا الموقف فقط: هل بقي حدّك واضحًا، وكيف عبّرت عنه، وما الذي ظهر. ثقة ${C.name} تؤثر في بعض المعايير، لأن الكلام نفسه يكشف أكثر حين تكون الثقة أعلى.</p>
        <p>هذا تقييم تعليمي للتأمل والنقاش فقط. لم يُختبر علميًا، ولا يقيس قدراتك أو شخصيتك.</p></div></details>
    </section>

    <section class="part" aria-labelledby="r-h"><h2 id="r-h">راجع قراراتك</h2>
      <p class="note">${traps?`وقعت في الفخ ${traps} ${traps===1?"مرة":"مرات"}. هذه ردودك، ومعها خيار أفضل حيث يلزم.`:"لم تقع في أي فخ. هذه ردودك كاملة."}</p>
      <ol class="review">${s.log.map((l,i)=>`<li>
        <div class="top"><span class="label">${i+1}. ${AREAS[l.area].name}${l.back?" (رجوع)":""}</span>${pill(l.type)}</div>
        <p>${esc(l.text)}</p>
        ${l.better?`<p class="better"><b>خيار أفضل:</b> ${esc(l.better.text)}</p>`:""}
      </li>`).join("")}</ol>
      <div class="start">${Object.keys(AREAS).filter(a=>s.log.some(l=>l.area===a&&!l.back)).map(a=>`<button class="btn" data-retry="${a}">أعد من ${AREAS[a].name}</button>`).join("")}</div>
    </section>

    <section class="part" aria-labelledby="f-h"><h2 id="f-h">لحظة تأمل</h2>
      <form class="reflect" id="refl">
        <div><label for="q1">في أي لحظة شعرت بأقوى رغبة في التبرير أو التراجع؟ ولماذا؟</label><textarea id="q1">${esc(R.q1||"")}</textarea></div>
        <div><label for="q2">ما الحدّ الوحيد الذي ستعبّر عنه هذا الأسبوع؟ مع من، وبأي جملة؟</label><textarea id="q2">${esc(R.q2||"")}</textarea></div>
        <div class="start"><button class="btn" type="button" data-act="copy">انسخ إجاباتي</button><button class="btn primary" type="button" data-act="restart">ابدأ من جديد</button><button class="btn" type="button" data-act="choose">جرّب الشخصية الأخرى</button></div>
        <p class="ok" id="ok" role="status"></p>
        <p class="note">إجاباتك محفوظة في هذا المتصفح فقط.</p>
      </form>
    </section>
  </div>`;
}

function tour(){
  const i=st.tour||0, t=C.TOUR[i], last=i===C.TOUR.length-1, review=st.tourFrom==="sim";
  $("#app").innerHTML=`<section class="tour enter" aria-labelledby="tour-h">
    <div class="tour-top"><p class="label">تعرّف على ${C.name} · <span class="en" lang="en">Reading ${C.en}</span></p>
      <p class="tour-count">الحالة ${i+1} من 4</p></div>
    <h1 id="tour-h" tabindex="-1">راقب وجه ${C.name} طوال الموقف</h1>
    <p class="note">ثقة ${C.name} بك تتغيّر مع كل ردّ، ويظهر ذلك في وجه${C.h} وطريقة كلام${C.h}. تعرّف على حالات${C.h} الأربع قبل أن تبدأ.</p>
    <ol class="tour-strip" aria-label="الحالات الأربع">${MOODS.map((m,j)=>`<li class="${j===i?"on":j<i?"seen":""}">${av(j,"")}<span>${m}</span></li>`).join("")}</ol>
    <div class="tour-card">
      <div class="tour-face">${av(i)}<h2>${MOODS[i]}</h2>
        <span class="tour-bar" aria-label="مستوى الثقة ${i+1} من 4"><span class="dots" aria-hidden="true">${[0,1,2,3].map(j=>`<i class="${j<=i?"on":""}"></i>`).join("")}</span></span></div>
      <div class="tour-body">
        <h3>كيف تعرف${C.h}</h3><ul>${t.see.map(x=>`<li>${x}</li>`).join("")}</ul>
        <h3>ما الذي يوصل${C.h} لهنا</h3><p>${t.why}</p>
        <div class="tour-act"><b>ماذا تفعل</b><p>${t.act}</p></div>
      </div>
    </div>
    ${last?`<p class="tour-note">انتبه: ردّ واحد سيئ قد يُنزل ثقت${C.h} درجة أو درجتين، واستعادتها تحتاج أكثر من ردّ جيد.</p>`:""}
    <div class="row tour-nav">
      ${i>0?`<button class="btn" data-act="tour-prev">السابق</button>`:""}
      ${last?`<button class="btn primary big" data-act="tour-done">${review?"عودة للموقف":"ابدأ الموقف"}</button>`:`<button class="btn primary" data-act="tour-next">الحالة التالية</button>`}
    </div>
  </section>`;
}
function render(focus){
  VOICE.stop();
  tools();
  if(st.screen==="cover") cover();
  else if(st.screen==="choose"){ choose(); const f=focus&&$(focus); if(f) f.focus(); }
  else if(st.screen==="intro") intro();
  else if(st.screen==="sim") sim(focus);
  else if(st.screen==="tour"){ tour(); const f=focus&&$(focus); if(f) f.focus(); }
  else { end(); const f=focus&&$(focus); if(f) f.focus(); }
}

/* ============ الأحداث ============ */
function reset(){ Object.assign(st,{screen:"intro",hist:[],waiting:false,sel:null,refl:{},confirming:false}); save(); render(); window.scrollTo(0,0); }
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.speak!==undefined){ const l=compute(st.hist).log[+b.dataset.speak]; if(l) VOICE.say(l.reply, moodOf(l.to)); return; }
  if(b.dataset.char){ const same=st.char===b.dataset.char; st.char=b.dataset.char; useChar(st.char); Object.assign(st, same ? {screen:"intro"} : {screen:"intro",hist:[],waiting:false,sel:null,refl:{}}); save(); render(); window.scrollTo(0,0); return; }
  if(b.dataset.choice){ st.sel=b.dataset.choice; save(); sim("#o-"+st.sel); return; }
  if(b.dataset.retry){
    const s=compute(st.hist), i=s.log.findIndex(l=>l.area===b.dataset.retry&&!l.back);
    st.hist=st.hist.slice(0,i); Object.assign(st,{waiting:false,sel:null,screen:"sim"}); save(); render("#q-h"); window.scrollTo(0,0); return;
  }
  switch(b.dataset.act){
    case "start": Object.assign(st,{hist:[],waiting:false,sel:null,screen:"tour",tour:0,tourFrom:"start"}); save(); render("#tour-h"); window.scrollTo(0,0); break;
    case "tour-next": st.tour=Math.min(3,(st.tour||0)+1); save(); render("#tour-h"); break;
    case "tour-prev": st.tour=Math.max(0,(st.tour||0)-1); save(); render("#tour-h"); break;
    case "tour-done": st.screen="sim"; save(); render(st.waiting?"#fb-h":"#q-h"); window.scrollTo(0,0); break;
    case "tour-review": Object.assign(st,{screen:"tour",tour:0,tourFrom:"sim"}); save(); render("#tour-h"); window.scrollTo(0,0); break;
    case "resume": st.screen = st.screen==="tour" ? "tour" : "sim"; if(st.screen==="tour"){ save(); render("#tour-h"); break; } save(); render(st.waiting?"#fb-h":"#q-h"); break;
    case "say": { if(!st.sel) return; st.hist.push(st.sel); st.sel=null; st.waiting=true; save();
      const s=compute(st.hist); const l=s.log[s.log.length-1]; announce(C.name+": "+l.reply); render("#fb-h"); if(st.voice!==false) VOICE.say(l.reply, moodOf(l.to)); break; }
    case "voice": st.voice = st.voice===false; save(); if(st.voice===false) VOICE.stop(); tools(); break;
    case "next": st.waiting=false; save(); render("#q-h"); if(st.screen==="end") window.scrollTo(0,0); break;
    case "reset": st.confirming=true; tools(); break;
    case "reset-no": st.confirming=false; tools(); break;
    case "reset-yes": case "restart": reset(); break;
    case "begin": VOICE.prime(); st.screen="choose"; save(); render("#pick-h"); window.scrollTo(0,0); break;
    case "home": st.screen="cover"; st.confirming=false; save(); render(); window.scrollTo(0,0); $(".pulse")&&$(".pulse").focus(); break;
    case "choose": st.screen="choose"; st.confirming=false; save(); render("#pick-h"); window.scrollTo(0,0); break;
    case "copy": {
      const s=compute(st.hist), R=st.refl||{};
      const txt=`«لا» الصعبة (${C.name}): تأملاتي\nردود متوازنة: ${s.good} من ${s.log.length}\n`+
        (()=>{ const M=matrix(s); return Object.keys(DIMS).map(k=>`${DIMS[k].name}: ${M[k].score} من 3 (${LEVELS[M[k].lvl]})`).join("\n")+`\nالمجموع: ${M.total} من 12`; })()+
        `\n\n${$("label[for=q1]").textContent}\n${R.q1||"-"}\n\n${$("label[for=q2]").textContent}\n${R.q2||"-"}`;
      const ok=$("#ok"), fail=()=>ok.textContent="النسخ غير متاح هنا. حدّد النص وانسخه يدويًا.";
      try{ navigator.clipboard.writeText(txt).then(()=>ok.textContent="تم النسخ.",fail); }catch(err){ fail(); }
      break; }
  }
});
document.addEventListener("input",e=>{ if(e.target.closest("#refl")){ st.refl[e.target.id]=e.target.value; save(); } });
document.addEventListener("keydown",e=>{
  const c=e.target.closest&&e.target.closest(".opt"); if(!c) return;
  const all=[...document.querySelectorAll(".opt")], i=all.indexOf(c); let n=null;
  if(e.key==="ArrowDown"||e.key==="ArrowLeft") n=all[(i+1)%all.length];
  if(e.key==="ArrowUp"||e.key==="ArrowRight") n=all[(i-1+all.length)%all.length];
  if(n){ e.preventDefault(); st.sel=n.dataset.choice; save(); sim("#o-"+st.sel); }
});
render();
</script>

</body>
</html>
